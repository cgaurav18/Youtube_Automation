name: Upload Shorts to YouTube

on:
  schedule:
    # 10:00 and 18:00 IST (Asia/Kolkata, UTC+5:30) == 04:30 and 12:30 UTC.
    # GitHub Actions cron is UTC-only and not minute-precise (can slip a few
    # minutes under load) — fine for a twice-a-day poster.
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shorts-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        env:
          GOOGLE_CLIENT_SECRET_JSON_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON_B64 }}
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
        run: |
          mkdir -p auth
          echo "$GOOGLE_CLIENT_SECRET_JSON_B64" | base64 -d > auth/client_secret.json
          echo "$GOOGLE_TOKEN_JSON_B64" | base64 -d > auth/token.json

      - name: Run uploader
        run: python3 main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update posted-videos state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
